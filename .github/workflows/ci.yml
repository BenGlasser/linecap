name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-pass:
    name: 'Test: under-limit files pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          targets: explicit
          explicit_files: |
            test/fixtures/small.txt
          max_lines: '400'

  test-fail:
    name: 'Test: over-limit files fail'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: should-fail
        uses: ./
        continue-on-error: true
        with:
          targets: explicit
          explicit_files: |
            test/fixtures/big.txt
          max_lines: '400'

      - name: Verify action failed
        shell: bash
        run: |
          if [[ "${{ steps.should-fail.outcome }}" != "failure" ]]; then
            echo "::error::Expected action to fail for over-limit file, but it passed."
            exit 1
          fi
          echo "Action correctly failed for over-limit file."

      - name: Verify offenders output
        shell: bash
        run: |
          OFFENDERS="${{ steps.should-fail.outputs.offenders }}"
          if [[ -z "$OFFENDERS" ]]; then
            echo "::error::Expected offenders output to be non-empty."
            exit 1
          fi
          echo "Offenders output correctly populated:"
          echo "$OFFENDERS"
